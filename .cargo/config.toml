[alias]
xtask = "run -p xtask --"
utask = "run -p xtask --features uniffi --"
fast = "run -p fast --"

# The static link line interleaves ~100 archives with dynamic system libs. bfd
# is single pass and cannot resolve helper archives appended after the dynamic
# libs they reference, so pin a modern linker.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
# RELR-packed relative relocations, ~2.2MB smaller binary; needs glibc
# 2.36+, satisfied by NixOS and the flathub 25.08 runtime
rustflags = ["-C", "link-arg=--ld-path=wild", "-Clink-arg=-Wl,-z,pack-relative-relocs"]

# Static GStreamer for the whole tree, zero env setup. The forked -sys crates
# (see [patch.crates-io]) probe the static build through their gstreamer-src
# dependency, so no pkg-config stubs or shims are involved. Every value here
# is a default a real environment variable still overrides.
[env]
# Our fork is 1.29.2 plus the patch set, one commit each.
GSTREAMER_SRC_REPO = "https://gitlab.futo.org/fcast/gstreamer.git"
GSTREAMER_SRC_REF = "fcast/1.29.2"
# Deterministic build-tree location, independent of any global cargo build-dir.
GSTREAMER_SRC_BUILD_ROOT = { value = "target/gst-static", relative = true }
# librice's ICE layer links rice-proto, a C ABI cargo-c builds from a Rust
# crate. Until xtask folds that step in, system-deps is pointed at the prefix
# ../webrtcbin2/build-rice-proto.sh installs. Static, so the receiver carries it.
SYSTEM_DEPS_RICE_PROTO_NO_PKG_CONFIG = "1"
SYSTEM_DEPS_RICE_PROTO_SEARCH_NATIVE = { value = "../webrtcbin2/target/rice-proto/lib", relative = true }
SYSTEM_DEPS_RICE_PROTO_LIB = "rice-proto"
SYSTEM_DEPS_RICE_PROTO_INCLUDE = { value = "../webrtcbin2/target/rice-proto/include/rice", relative = true }
SYSTEM_DEPS_RICE_PROTO_LINK = "static"
# Target-scoped C toolchain for cc-rs build scripts (ring, skia glue, ...):
# the nix host clang wrapper cannot cross-compile to android. The wrappers
# resolve the NDK like the linkers do.
CC_aarch64-linux-android = { value = "android-linker-aarch64", relative = true }
CXX_aarch64-linux-android = { value = "android-cxx-aarch64", relative = true }
AR_aarch64-linux-android = { value = "android-ar", relative = true }
CC_x86_64-linux-android = { value = "android-linker-x86_64", relative = true }
CXX_x86_64-linux-android = { value = "android-cxx-x86_64", relative = true }
AR_x86_64-linux-android = { value = "android-ar", relative = true }
CC_armv7-linux-androideabi = { value = "android-linker-armv7", relative = true }
CXX_armv7-linux-androideabi = { value = "android-cxx-armv7", relative = true }
AR_armv7-linux-androideabi = { value = "android-ar", relative = true }

# NDK clang as the final-link linker for android targets (executable paths
# with separators in config are config-relative since cargo 1.73). The
# wrappers resolve the NDK like gstreamer-src's build.rs does.
# packed dynamic relocations save ~2.2MB in the .so; APS2 needs API 23+,
# our minSdk is 28 (RELR would need 30)
# 16KB LOAD alignment is a Play requirement (mandatory for targetSdk 35+
# uploads). NDK r28+ defaults to it, but an NDK downgrade would silently
# revert to 4KB, so it is pinned here and asserted at APK packaging.
# A build-id is what lets simpleperf match a stripped on-device library to
# the unstripped one on the host (report --symdir), without it the report
# shows raw offsets. Twenty bytes of note section.
[target.aarch64-linux-android]
linker = "./android-linker-aarch64"
rustflags = [
    "-Clink-arg=-Wl,--pack-dyn-relocs=android",
    "-Clink-arg=-Wl,-z,max-page-size=16384",
    "-Clink-arg=-Wl,--build-id=sha1",
]

[target.x86_64-linux-android]
linker = "./android-linker-x86_64"
rustflags = [
    "-Clink-arg=-Wl,--pack-dyn-relocs=android",
    "-Clink-arg=-Wl,-z,max-page-size=16384",
]

# 32-bit userspace TV boxes (Amlogic). Pages are 4KB there, the 16KB
# alignment just keeps the packaging assert uniform across ABIs.
[target.armv7-linux-androideabi]
linker = "./android-linker-armv7"
rustflags = [
    "-Clink-arg=-Wl,--pack-dyn-relocs=android",
    "-Clink-arg=-Wl,-z,max-page-size=16384",
    "-Clink-arg=-Wl,--build-id=sha1",
]
