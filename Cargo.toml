[workspace]
members = [
    "xtask",
    "sdk/sender/fcast-sender-sdk",
    "sdk/sender/flutter-plugin/rust",
    "senders/terminal",
    "crates/fcast-protocol",
    "crates/mirroring-core",
    "senders/desktop",
    "senders/android",
    "tools/fast",
    "crates/file-server",
    "senders/android",
    "crates/receiver-core",
    "crates/receiver-ui",
    "receivers/desktop",
    "receivers/experimental/android",
    "crates/app-updater",
    "crates/google-cast-protocol",
    "crates/receiver-resources",
    "crates/inhibit-screensaver",
    "crates/fcast-gst-elements",
    "crates/fcast-runtime",
    "crates/fcast-video",
    "fuzz",
    "sdk/sender/examples/image-viewer",
    "crates/apple-fairplay",
]
# Plain `cargo build`/`test`/`check` at the root builds only these; `-p` and
# `--workspace` still reach everything, and every crate below is still a member.
#
# Excluded: the image-viewer example (slint + femtovg for an SDK example — dead
# weight in every sweep), the android crates (need the NDK), and the sender side — the
# senders, the sender SDK and its flutter plugin, plus the crates only they use
# (mirroring-core, file-server, tools/fast). Work here is receiver work; the
# sender tree is one `cargo xtask test-sender` away. Shared crates
# (fcast-protocol, sabrump, google-cast-protocol) stay: the receiver uses them.
default-members = [
    "xtask",
    "crates/fcast-protocol",
    "crates/receiver-core",
    "crates/receiver-ui",
    "receivers/desktop",
    "crates/app-updater",
    "crates/google-cast-protocol",
    "crates/receiver-resources",
    "crates/inhibit-screensaver",
    "crates/fcast-gst-elements",
    "crates/fcast-runtime",
    "crates/fcast-video",
    "fuzz",
    "crates/apple-fairplay",
]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
# Build script builds our patched GStreamer fork with meson/ninja and emits the
# static link line, inherited by every binary that depends on it. Every crate that touches
# gst carries it so its own test binaries link too.
gstreamer-src = { git = "https://gitlab.futo.org/fcast/gstreamer-src.git", branch = "master" }
gst-static-link = { git = "https://gitlab.futo.org/fcast/gstreamer-src.git", branch = "master" }
gst-static-env = { git = "https://gitlab.futo.org/fcast/gstreamer-src.git", branch = "master" }
# The media player library and its test simulator, extracted 2026-08-23. The
# android line and the Rust network elements live on master.
flapjack = { git = "https://gitlab.futo.org/fcast/flapjack.git", branch = "master" }
simulator = { git = "https://gitlab.futo.org/fcast/flapjack.git", branch = "master" }
tokio = { version = "1.52", features = [ "full" ] }
serde = { version = "1.0", features = [ "derive" ] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25", features = [ "v1_24" ] }
gst-video = { package = "gstreamer-video", version = "0.25", features = [ "v1_24" ] }
gst-base = { package = "gstreamer-base", version = "0.25", features = [ "v1_24" ] }
gst-plugin-rtp = { rev = "a35f7d35ecd37a0627983c9235e8417457805618", git = "https://gitlab.futo.org/fcast/gst-plugins-rs.git", default-features = false, features = [ "static", "depay", "rtpbin2" ] }
gst-plugin-webrtc = { rev = "a35f7d35ecd37a0627983c9235e8417457805618", git = "https://gitlab.futo.org/fcast/gst-plugins-rs.git", default-features = false }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.25" }
# The Rust WebRTC stack the desktop receiver mirrors through: webrtcbin2
# (librice ICE, dimpl DTLS, rtpbin2 underneath) and fcast's receive bins on
# it, registered on every platform (`gstreamer.rs` plugin_register_static,
# no cfg). rice-proto is a Rust crate from the librice fork now, so there is
# no cross-built C ABI and no build-rice-proto.sh wiring left to carry.
gst-plugin-webrtcbin2 = { git = "https://gitlab.futo.org/fcast/webrtcbin2.git", rev = "827eed7e10188e59e19ce894ab9fe2199cea0a66" }
fcast-webrtc = { git = "https://gitlab.futo.org/fcast/webrtcbin2.git", rev = "827eed7e10188e59e19ce894ab9fe2199cea0a66" }
gst-pbutils = { package = "gstreamer-pbutils", version = "0.25" }
# flapjack's in-tree subparse: the player and the receiver must share ONE
# `CueIr`, the cue engine keys its raster cache on the same `Arc`.
flapjack-subparse = { git = "https://gitlab.futo.org/fcast/flapjack.git", branch = "master" }
# The cue-IR renderer stack (crates/fcast-video/src/cue_ir.rs). vello_cpu keeps
# the exact revision the upstream cueir-demo pins: the parley workspace's own,
# which its examples (and our rasterizer) are written against.
parley = "0.11"
peniko = "0.6"
vello_cpu = { git = "https://github.com/linebender/vello.git", rev = "5796226", default-features = false, features = [ "std", "png", "text", "u8_pipeline" ] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11.8"
mdns-sd = "0.20.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-gstreamer = { git = "https://github.com/MAlba124/tracing-gstreamer.git", rev = "3ad7a1e71a4ca4d1fd9a229642fd09586370acaf" }
tracing-panic = "0.1.2"
parking_lot = "0.12"
# The slint fork, by rev from git. slint-gstreamer-video names the same rev
# and so must every i-slint-* pin in the tree: two revs in one graph is two
# i-slint-core types, which reads as `expected slint::Weak<_>, found
# slint::Weak<MainWindow>` and six friends.
slint = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "f6ddf0c5a7fc1c2886963030d5c7dd90fdc142d5", default-features = false }
slint-build = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "f6ddf0c5a7fc1c2886963030d5c7dd90fdc142d5" }
i-slint-backend-winit = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "f6ddf0c5a7fc1c2886963030d5c7dd90fdc142d5" }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.23", features = [ "v4" ] }
bytes = "1"
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
toml_edit = { version = "0.25", features = ["serde"] }
futures = "0.3"
lazy_static = "1.5"
rand = "0.10"
num_cpus = "1"
image_swizzle = "0.3.0"
mimalloc = { version = "0.1", features = ["v3"] }
ctrlc = "3"
hyper = "1"
hyper-util = "0.1"
bindgen = "0.72"
webbrowser = "1"
glow = "0.17"
# Text shaping/rasterization for sink-side subtitle cues (fcast-video) and the
# static-build font closure (receiver-core).
libloading = "0.9.0"
askama = "0.15"
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false }
rustls-pki-types = "1.14"
sha2 = "0.11"
isolang = "2.4.0"
self_cell = "1.2.2"
directories = "6.0.0"
regex = "1.12"
infer = "0.19.0"
image = { version = "0.25", default-features = false }
base64 = "0.22"
x509-parser = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# naga only runs at pipeline-cache misses (a few times per stream), so size
# beats speed for it; measured -481 KiB with ~2ms one-time compile cost
[profile.release.package.naga]
opt-level = "z"

[profile.release-dbg]
inherits = "release"
debug = "full"
strip = false

[profile.release-small]
inherits = "release"
opt-level = "s"
panic = "abort"

[profile.release-android]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.release-prof]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package]
read-fonts = { opt-level = 2 }
font-types = { opt-level = 2 }
skrifa = { opt-level = 2 }
harfrust = { opt-level = 2 }
parley = { opt-level = 2 }
fontique = { opt-level = 2 }
swash = { opt-level = 2 }
zeno = { opt-level = 2 }
icu_segmenter = { opt-level = 2 }
icu_properties = { opt-level = 2 }
zerotrie = { opt-level = 2 }
zerovec = { opt-level = 2 }
lyon_tessellation = { opt-level = 2 }
lyon_path = { opt-level = 2 }
vello_cpu = { opt-level = 2 }
vello_common = { opt-level = 2 }
fearless_simd = { opt-level = 2 }
kurbo = { opt-level = 2 }
peniko = { opt-level = 2 }
color = { opt-level = 2 }
bytemuck = { opt-level = 2 }
# The wgpu video lane at debug opt drops frames wholesale; the stack is
# stable dependency code, so debug builds get it optimized. Our own small
# crate is included since the per-frame readback memcpy lives there.
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
wgpu-types = { opt-level = 3 }
naga = { opt-level = 3 }
ash = { opt-level = 3 }
gpu-allocator = { opt-level = 3 }
i-slint-video-wgpu = { opt-level = 3 }

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.byteorder-lite]
opt-level = 3

# flapjack builds from the pushed master (the workspace deps above). To iterate
# on a local checkout instead, patch all four crates back to it at once:
# flapjack, simulator, flapjack-subparse and flapjack-subparse-formats. The last
# one because the slint fork's layout crate names it directly, and a graph that
# carries the git copy beside the local one has two different `CueIr` types.

[patch.crates-io]
# librice fork: rice-c consumes rice-proto as a Rust crate (its capi feature),
# not a cargo-c C staticlib. Drops the .a's bundled std (which collided with the
# LTO'd std in release builds), bindgen, system-deps, and the per-ABI rice-proto
# cross-build. Patching librice cascades: its rice-c/rice-proto are path deps in
# the fork workspace, so they come from the fork too.
librice = { git = "https://gitlab.futo.org/fcast/librice.git", rev = "17ef3a67f949f71b686968496365269bdeff449f" }
# flapjack's reqwest fork, branched from the 0.13.4 tag: HTTP/3 without the
# `reqwest_unstable` gate, taken through Alt-Svc, and `http3` on quinn's
# aws-lc-rs provider so ring stays out of the tree. Every 0.13 reqwest in the
# tree resolves to it.
reqwest = { git = "https://gitlab.futo.org/fcast/reqwest.git", rev = "cd3a562866982a624ab103f4919897d8ed3124d1" }
# Disable encoders
image = { git = "https://gitlab.futo.org/fcast/image-rs.git", rev = "9ee78f3f" }
rustls = { git = "https://gitlab.futo.org/fcast/rustls.git", rev = "72ec207b" }
libheif-sys = { git = "https://gitlab.futo.org/fcast/libheif-sys.git", rev = "f8dc2979346be29c85facf307d42a72745d5d038" }
# Bundled-linking forks: the -sys crates probe the static GStreamer through
# their gstreamer-src dependency, no stub .pc files or env setup. The glib
# trio is scope-aware (static wrap glib under scope=Full only).
gstreamer-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-app-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-audio-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-base-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-video-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-tag-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-allocators-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-pbutils-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-webrtc-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-sdp-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-rtp-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-net-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
gstreamer-check-sys = { git = "https://gitlab.futo.org/fcast/gstreamer-rs.git", branch = "fcast/0.25.3" }
glib-sys = { git = "https://gitlab.futo.org/fcast/gtk-rs-core.git", branch = "fcast/0.22.8" }
gobject-sys = { git = "https://gitlab.futo.org/fcast/gtk-rs-core.git", branch = "fcast/0.22.8" }
gio-sys = { git = "https://gitlab.futo.org/fcast/gtk-rs-core.git", branch = "fcast/0.22.8" }
# dav1d-sys fork: `bundled` links the dav1d archive gstreamer-src built
# in-tree whenever it exported one, android included, and probes the host
# otherwise.
dav1d-sys = { git = "https://gitlab.futo.org/fcast/dav1d-rs.git", branch = "fcast/0.11.1" }

