[package]
name = "receiver-core"
version = "3.0.4"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
gst-static-env.workspace = true
gstreamer-src.workspace = true
tokio.workspace = true
gst = { workspace = true, features = [ "v1_26" ] }
# `sabr`: sabrumpsrc for sabrump:// URIs, a flapjack plugin now.
flapjack = { workspace = true, features = ["sabr"] }
fcast-gst-elements = { path = "../fcast-gst-elements" }
flapjack-subparse.workspace = true
fcast-runtime = { path = "../fcast-runtime" }
fcast-video = { path = "../fcast-video" }
# The render tier's vocabulary, which the CLI and the settings file carry and
# the video sink's property is a rename of. No GStreamer and no wgpu in it, so
# it costs nothing on the arms that never present a frame.
i-slint-video = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "a13373a73fb3b13fadf1e57bc0378e2c082f850c" }
fcast-protocol = { path = "../../crates/fcast-protocol", features = ["tokio-receiver"] }
gethostname = "1"
anyhow.workspace = true
futures.workspace = true
tokio-stream = "0.1"
url = "2"
thiserror = "2"
mdns-sd.workspace = true
fast_qr = { version = "0.13", features = [ "svg" ] }
gst-app.workspace = true
gst-video.workspace = true
gst-base.workspace = true
gst-pbutils.workspace = true
serde.workspace = true
serde_json.workspace = true
if-addrs = "0.15"
base64.workspace = true
bitflags = "2.10"
smallvec.workspace = true
smol_str.workspace = true
parking_lot.workspace = true
bytes.workspace = true
gst-plugin-dav1d = { git = "https://gitlab.futo.org/fcast/gst-plugins-rs.git", rev = "a35f7d35ecd37a0627983c9235e8417457805618", features = [ "static" ], optional = true }
# Flips the forked crate's bundled feature: the static wrap's dav1d whenever
# gstreamer-src built one, a normal system probe otherwise.
dav1d-sys = { version = "0.8", features = ["bundled"], optional = true }
gst-tag = { package = "gstreamer-tag", version = "0.25" }
rand = { workspace = true, features = ["std_rng"] }
tracing-tracy = { version = "=0.11.2", optional = true }
hayro-jpeg2000 = "0.3"
jxl-oxide = { version = "0.12", features = ["image"] }
oneshot = { version = "0.2", features = ["std"] }
toml_edit.workspace = true
directories.workspace = true
headers = "0.4"
mime = "0.3"
regex.workspace = true
self_cell.workspace = true
# avif-native is the dav1d binding, and dav1d-sys links the archive
# gstreamer-src cross-built in its own tree, android included, because THIS
# crate is what turns its `bundled` feature on (see `dav1d-plugin`).
image = { workspace = true, features = [
    "decode",
    "avif-native",
    "bmp", "dds", "ff", "gif", "ico",
    "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }

# RAOP
rtsp-types = "0.1"
sdp-types = "0.1"
rsa = { version = "0.9", features = ["sha2", "sha1"] }
sha2.workspace = true
sha1 = "0.10"
lazy_static = "1.5"
md-5 = "0.11"
aes = "0.8"
alac = { version = "0.5", default-features = false }
cbc = { version = "0.1", features = ["alloc", "std"] }
nom = "7.1"
gst-audio = { package = "gstreamer-audio", version = "0.25" }
byte-slice-cast = "1"
rtp-types = "0.1"

# AirPlay
plist = { version = "1", optional = true }
ctr = { version = "0.9", optional = true }
apple-fairplay = { path = "../apple-fairplay", optional = true }

# Google Cast
rustls-pki-types.workspace = true
google-cast-protocol = { path = "../google-cast-protocol" }
rcgen.workspace = true
uuid.workspace = true

# Mirroring and WHEP on the Rust WebRTC stack, every platform: webrtcbin2
# (librice ICE, dimpl DTLS, rtpbin2) and fcast's receive/send bins on it.
# rtprecv lives under webrtcrecv, the depayloaders come from the same crate.
gst-plugin-rtp.workspace = true
fcast-webrtc.workspace = true
gst-plugin-webrtcbin2.workspace = true


[target.'cfg(not(target_os = "android"))'.dependencies]
tracing-gstreamer.workspace = true
tracing-panic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [ "env-filter" ] }
# Only to cap the `log` bridge at the configured level, see logging.rs.
log.workspace = true
clap.workspace = true
inhibit-screensaver.path = "../inhibit-screensaver"

[target.'cfg(target_os = "macos")'.dependencies]
image = { workspace = true, features = ["encode"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_50"] }
libspa = "0.10"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = [ "charset", "http2", "system-proxy", "rustls-no-provider", "gzip", "cookies" ] }
libheif-rs = { version = "2.6", default-features = false, features = [ "v1_20", "image" ] }
tokio-rustls = { workspace = true, default-features = false, features = [ "logging", "aws-lc-rs", "tls12" ] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
tracing-gstreamer.workspace = true
tracing-panic.workspace = true
tracing = { workspace = true, features = [ "log" ] }
jni = "0.21.1"
ndk-context = "0.1"
reqwest = { version = "0.13", default-features = false, features = [ "charset", "http2", "system-proxy", "rustls-no-provider", "gzip", "cookies" ] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [ "logging", "aws-lc-rs", "tls12" ] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [ "native-tls", "charset", "http2", "system-proxy", "gzip", "cookies" ] }
app-updater = { path = "../app-updater"}
tokio-rustls = { version = "0.26.4", default-features = false, features = [ "logging", "aws-lc-rs", "tls12" ] }
receiver-resources.path = "../receiver-resources"
libheif-rs = { version = "2.6", default-features = false, features = [ "v1_20", "image", "embedded-libheif" ] }

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
http-body-util = "0.1.1"
pin-project-lite = "0.2"
gst-check = { package = "gstreamer-check", version = "0.25" }
# Flips the forked -sys crate onto the static GStreamer, like gst-static-env
# does for the shipping set. Without it the test lane probes pkg-config for a
# gstreamer-check that hermetic hosts do not have.
gstreamer-check-sys = { version = "0.25", features = ["bundled"] }
ctor = "0.2"
# Encoders are excluded from shipping builds (binary size); tests encode
# their own image fixtures.
image = { workspace = true, features = ["encode"] }
# The driver's transport fixtures. This crate is the only one that can see both
# them and the decoders they are fed to (flapjack cannot depend on
# fcast-video), which is what `the_drivers_bitmap_fixtures_decode` needs.
simulator.workspace = true


[features]
default = []
airplay = ["dep:plist", "dep:ctr", "dep:apple-fairplay"]
desktop = ["static-gst-plugins"]
systray = []
kms-backend = []
android = ["dav1d-plugin"]
tracy = ["dep:tracing-tracy"]
static-gst-plugins = ["dav1d-plugin"]
# The software AV1 decoder. Android needs this more than desktop does:
# hardware AV1 decoding is far from universal, and without a software decoder
# an AV1 stream on a device that lacks it has nothing to fall back to.
dav1d-plugin = ["dep:gst-plugin-dav1d", "dep:dav1d-sys"]

[build-dependencies]
gst-static-link.workspace = true
