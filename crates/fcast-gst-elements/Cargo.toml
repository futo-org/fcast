[package]
name = "fcast-gst-elements"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gst = { workspace = true, features = ["v1_26"] }
gst-base.workspace = true
gst-app.workspace = true
gst-video.workspace = true
gst-audio = { package = "gstreamer-audio", version = "0.25" }
gst-plugin-webrtc = { workspace = true, features = [ "static", "src", "whep-client" ] }
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
bytes.workspace = true
base64.workspace = true
serde_json.workspace = true
tracing.workspace = true
fcast-runtime = { path = "../fcast-runtime" }
url = "2"
mime = "0.3"
headers = "0.4"
sabrump = { path = "../sabrump", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_50"] }
libspa = "0.10"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = [ "charset", "http2", "system-proxy", "rustls-no-provider", "gzip", "cookies" ] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [ "native-tls", "charset", "http2", "system-proxy", "gzip", "cookies" ] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [ "native-tls", "charset", "http2", "system-proxy", "gzip", "cookies" ] }

[features]
textoverlay = []

[dev-dependencies]
hyper = { workspace = true, features = ["server"] }
http-body-util = "0.1.1"
pin-project-lite = "0.2"
tokio-rustls = { workspace = true, default-features = false, features = [ "logging", "ring", "tls12" ] }
gst-check = { package = "gstreamer-check", version = "0.25" }
ctor = "0.2"
