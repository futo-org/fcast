[package]
name = "receiver-ui"
version = "3.0.4"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
gst-static-env.workspace = true
gstreamer-src.workspace = true
receiver-core = { path = "../receiver-core" }
fcast-video = { path = "../fcast-video" }
fcast-protocol = { path = "../fcast-protocol", features = ["tokio-receiver"] }
fcast-runtime = { path = "../fcast-runtime" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
oneshot = { version = "0.2", features = ["std"] }
gst = { workspace = true, features = [ "v1_26" ] }
gst-base.workspace = true
gst-video.workspace = true

[dependencies.slint]
workspace = true
features = [
    "compat-1-2",
    "std",
]

[target.'cfg(not(target_os = "android"))'.dependencies]
tokio-rustls = { workspace = true, default-features = false, features = [ "logging", "aws-lc-rs", "tls12" ] }
# The desktop video lane stays off android: video is MediaCodec's direct
# surface there, so the receiver's own presentation lane is not built. The UI
# still renders on the GPU, through dodvg's wgpu executor in the fork.
#
# The lane's appsink, and the presentation crate with the wgpu it is built
# against (30, matching the slint fork's lock so the two never resolve to
# different wgpu crates). The presentation crate lives in the slint fork,
# which is what makes the single-wgpu property structural: dodvg depends on
# the same path.
gst-app = { workspace = true, optional = true }
i-slint-video-wgpu = { path = "../../../slint-forked/internal/video-wgpu", optional = true }
# Shader language only. The backend features are per-OS in the sections below,
# and cargo unions the features of every target section that matches, so a mac
# build gets `wgsl` from here and `metal` from its own.
#
# They cannot be one list: wgpu 30 turns the `vulkan` feature off on apple
# targets unless `vulkan-portability` is also set (it is meant for MoltenVK),
# and the `gles` feature off there unless `angle` is set. A single
# wgsl+vulkan+gles list therefore compiled NO backend at all into a mac build
# while still dragging ash in, which is why the lane could never have found an
# adapter on a MacBook.
wgpu = { version = "30", default-features = false, features = [
    "wgsl",
], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# the software video bridge's appsink
gst-app.workspace = true
# the immersive toggle's call into the activity
jni = "0.21"
ndk-context = "0.1"
# AHardwareBuffer, for the zero-copy software video lane. Raw bindings, not
# the safe `ndk` wrapper: its HardwareBuffer is behind an api-level feature
# and does not expose lockPlanes, which is the whole point here. Same version
# the slint android backend already pulls in, so nothing is duplicated.
ndk-sys = "0.6"
# the video surface behind the window (fork addition)
i-slint-backend-android-activity = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "8796fa98619e560970a3ab82bc97efa0a5894778" }

[target.'cfg(target_os = "linux")'.dependencies]
# The lane's dmabuf import. `ash` must resolve to the same crate
# wgpu-hal 30 uses, or the raw vulkan handles are different types; `gst-app`
# already pins the gst side and gst-allocators is where the dmabuf memory
# wrapper lives.
#
# `v1_28` is the floor the software-decode arm needs: gst 1.28 is where
# GstUdmabufAllocator and GstVideoDmabufPool landed, and the lane proposes
# that pair to software decoders (see src/desktop_wgpu_udmabuf.rs). Linux
# only, which is also the only place the bindings exist.
gst-allocators = { package = "gstreamer-allocators", version = "0.25", features = [ "v1_28" ], optional = true }
gst-video = { workspace = true, features = [ "v1_28" ] }
ash = { version = "0.38", optional = true }
# gles is the floor behind vulkan, see desktop_wgpu_video::backend_passes.
wgpu = { version = "30", default-features = false, features = [
    "vulkan",
    "gles",
], optional = true }

# The lane has never been run on windows. `dx12` is a one word addition here
# whenever someone has a box to try it on; nothing else in the lane is D3D
# aware either way.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = [
    "vulkan",
    "gles",
], optional = true }

# The cursor-hide callback in gui.rs sets the macOS cursor directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSCursor"] }
# Metal is the only backend wgpu offers on mac without a translation layer
# (vulkan needs MoltenVK, gl needs ANGLE), so it is the whole list. There is no
# dmabuf import here: gst-allocators and ash stay linux-only above and the
# appsink offers system memory only, so every frame takes the upload arm.
wgpu = { version = "30", default-features = false, features = [
    "metal",
], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The AV1 arm of the udmabuf proof needs dav1ddec in the test binary. The
# shipping receivers get it through receiver-core's `static-gst-plugins`, but
# that feature is off in the lane's own test runs, so the plugin is registered
# here instead and the test never silently skips. Same rev and same bundled
# dav1d wiring as receiver-core, or the two would resolve to different copies.
gst-plugin-dav1d = { git = "https://gitlab.futo.org/fcast/gst-plugins-rs.git", rev = "f8bdc4929ff79e2567d97c5e95ac90b452812c79", features = [ "static" ] }
dav1d-sys = { version = "0.8", features = ["bundled"] }

[dev-dependencies]
# The end-to-end subtitle proof drives the real player and the real text
# branch: flapjack owns the pipeline, the simulator synthesizes the streams.
flapjack.workspace = true
simulator.workspace = true
# The transition soak prints the lane's own log lines when RUST_LOG is set.
tracing-subscriber = { workspace = true, features = [ "env-filter" ] }

[build-dependencies]
gst-static-link.workspace = true
slint-build.workspace = true

[features]
default = []
airplay = ["receiver-core/airplay"]
desktop = [
    "slint/backend-winit",
    "slint/renderer-dodvg",
    "receiver-core/desktop",
    "scene-cues",
    # Desktop presentation through i-slint-video-wgpu, see
    # src/desktop_wgpu_video.rs. It needs slint itself on wgpu 30, so the
    # dodvg renderer's wgpu backend rides along; the OpenGL one above stays
    # for a box where no wgpu device comes up, which then plays without
    # video.
    "dep:i-slint-video-wgpu",
    "dep:wgpu",
    "dep:gst-app",
    "dep:gst-allocators",
    "dep:ash",
    "slint/unstable-wgpu-30",
    "slint/renderer-dodvg-wgpu",
]
# The route from the application to the dodvg renderer, which is where the
# subtitle cue overlay slot lives.
scene-cues = ["slint/unstable-winit-030"]
systray = ["slint/system-tray", "receiver-core/systray"]
kms-backend = ["slint/backend-linuxkms"]
# No renderer feature: the android backend carries dodvg on wgpu 30 itself,
# where it used to name skia here. `backend-android-activity-06` pulls no
# renderer of its own, so this list is the whole choice.
android = ["slint/backend-android-activity-06", "receiver-core/android"]
tracy = ["receiver-core/tracy"]
# Forwarded to the core so a receiver binary keeps naming one dependency.
static-gst-plugins = ["receiver-core/static-gst-plugins"]
