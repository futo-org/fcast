[package]
name = "fcasttest"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gst = { workspace = true, features = ["v1_26"] }
gst-base.workspace = true
gst-video.workspace = true
gst-audio = { package = "gstreamer-audio", version = "0.25" }
parking_lot.workspace = true
serde.workspace = true
# Scenario files, see src/scenario/toml.rs. No workspace entry to reuse: the rest
# of the tree edits TOML in place with toml_edit, this only deserialises.
toml = "1"
tracing.workspace = true

[dev-dependencies]
gst-app.workspace = true
