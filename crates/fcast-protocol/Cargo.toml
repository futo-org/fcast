[package]
name = "fcast-protocol"
description = "Data types for FCast"
repository = "https://gitlab.futo.org/videostreaming/fcast"
version = "0.2.0"
license.workspace = true
edition = "2021"
exclude = ["misc/", "tests/"]

[dependencies]
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
flatbuffers = "25.12.19"
base64.workspace = true

tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, optional = true }

# Tokio sender
rustls-pki-types = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-rustls = { workspace = true, default-features = false, features = ["logging", "ring", "tls12"] }
rustls-pki-types.workspace = true
sha2.workspace = true
rcgen.workspace = true
# Differential oracle for the spki module tests
x509-parser.workspace = true

[features]
default = []
tokio-sender = ["dep:tokio-rustls", "dep:tokio", "dep:tracing", "dep:sha2", "dep:rustls-pki-types"]
tokio-receiver= ["dep:tokio-rustls", "dep:tokio", "dep:tracing"]
# Exposes the spki module for the fuzz harness, not part of the public API
__fuzz = []