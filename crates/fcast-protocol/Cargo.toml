[package]
name = "fcast-protocol"
description = "Data types for FCast"
repository = "https://gitlab.futo.org/videostreaming/fcast"
version = "0.2.0"
license.workspace = true
edition = "2021"
exclude = ["misc/", "tests/"]

[dependencies]
flatbuffers = "25.12.19"

# serde
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# session
bytes = { workspace = true, optional = true }
smol_str = { workspace = true, optional = true }
self_cell = { workspace = true, optional = true }
bitflags = { version = "2.10", optional = true }
url = { version = "2", optional = true }

tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, optional = true }

# Tokio sender
rustls-pki-types = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-rustls = { workspace = true, default-features = false, features = ["logging", "aws-lc-rs", "tls12"] }
rustls-pki-types.workspace = true
sha2.workspace = true
rcgen.workspace = true
# Differential oracle for the spki module tests
x509-parser.workspace = true

[features]
# Without default features the crate is the framing, the v4 flatbuffers types
# and the serde free legacy sender codec, on flatbuffers alone
default = ["session"]
# The v1-v3 serde types and the network config url
serde = ["dep:serde", "dep:serde_json", "dep:base64"]
# The receiver session, companion resources and PacketReader
session = ["serde", "dep:bytes", "dep:smol_str", "dep:self_cell", "dep:bitflags", "dep:url"]
tokio-sender = ["tracing", "dep:tokio-rustls", "dep:tokio", "dep:tracing", "dep:sha2", "dep:rustls-pki-types"]
tokio-receiver = ["tracing", "dep:tokio-rustls", "dep:tokio", "dep:tracing"]
# Debug and error lines of the session state machine
tracing = ["dep:tracing"]
