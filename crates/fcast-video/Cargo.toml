[package]
name = "fcast-video"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gst-static-env.workspace = true
gstreamer-src.workspace = true
gst = { workspace = true, features = ["v1_26"] }
gst-base.workspace = true
gst-video.workspace = true
tracing.workspace = true
parking_lot.workspace = true
# The one text rasterizer (src/cue_ir.rs): parley + vello_cpu render every
# arm, pango-markup cues included (parsed by gst-subparse's pure-Rust
# pango-markup reimplementation). Nothing here links pango or cairo.
#
# gst-subparse is here for its `subparse_formats` + `pango_markup` re-exports
# alone; the plugin's elements are registered by receiver-core, not by us.
gst-subparse.workspace = true
parley.workspace = true
peniko.workspace = true
vello_cpu.workspace = true
anyhow.workspace = true
smallvec.workspace = true
thiserror.workspace = true
clap.workspace = true

[dev-dependencies]
# tests/cue_ir_engine.rs drives the REAL parser element into the engine, so it
# needs an appsrc/appsink pair to bracket it.
gst-app.workspace = true

[features]
default = []
# The dodvg subtitle oracle fixtures. Gates
# the `cue_dodvg_fixture` example, which dumps `CueScene`s plus the pixels the
# vello_cpu backend paints from them, so the dodvg consumer in the slint fork
# can draw the same display list and be diffed against it. Adds no dependency
# and nothing links it in a normal build.
cue-ir-spike = []

[[example]]
name = "cue_dodvg_fixture"
required-features = ["cue-ir-spike"]

[build-dependencies]
gst-static-link.workspace = true
