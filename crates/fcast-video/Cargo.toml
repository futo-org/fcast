[package]
name = "fcast-video"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gst-static-env.workspace = true
gstreamer-src.workspace = true
gst = { workspace = true, features = ["v1_26"] }
gst-base.workspace = true
gst-video.workspace = true
tracing.workspace = true
# `OverlaySpace` and the placement vocabulary, so the renderer that honours the
# distinction is the one that defines it. No GStreamer and no wgpu in it.
i-slint-video = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "7a593efd72644dcde77a151b309c97c57882806f" }
parking_lot.workspace = true
# The text rasterizer, which moved to the slint fork: parley lays a cue out
# and ends at a display list, vello_cpu paints one when a consumer needs
# pixels rather than primitives. Nothing here links pango or cairo.
i-slint-cue = { git = "https://gitlab.futo.org/fcast/slint.git", rev = "7a593efd72644dcde77a151b309c97c57882806f", features = [ "engine", "raster" ] }
# flapjack-subparse is here for its `pango_markup` re-export alone; the
# plugin's elements are registered by receiver-core, not by us.
flapjack-subparse.workspace = true
# The bitmap subtitle decoders (src/subpic.rs). They live with the transport
# that delivers their packets, so this crate and the driver no longer each
# carry a copy and a mirrored format enum.
flapjack.workspace = true
anyhow.workspace = true
smallvec.workspace = true
thiserror.workspace = true
clap.workspace = true

[dev-dependencies]
# tests/cue_ir_engine.rs drives the REAL parser element into the engine, so it
# needs an appsrc/appsink pair to bracket it.
gst-app.workspace = true

[features]
default = []
# The dodvg subtitle oracle fixtures. Gates
# the `cue_dodvg_fixture` example, which dumps `CueScene`s plus the pixels the
# vello_cpu backend paints from them, so the dodvg consumer in the slint fork
# can draw the same display list and be diffed against it. Adds no dependency
# and nothing links it in a normal build.
cue-ir-spike = []

[[example]]
name = "cue_dodvg_fixture"
required-features = ["cue-ir-spike"]

[build-dependencies]
gst-static-link.workspace = true
