[package]
name = "fcast-video"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gst-static-env.workspace = true
gstreamer-src.workspace = true
gst = { workspace = true, features = ["v1_26"] }
gst-base.workspace = true
gst-video.workspace = true
# GPU renderer only — see the `render` feature.
glow = { workspace = true, optional = true }
libplacebo = { path = "../libplacebo", optional = true }
drm-fourcc = "2.2.0"
tracing.workspace = true
parking_lot.workspace = true
# The one text rasterizer (src/cue_ir.rs): parley + vello_cpu render every
# arm, pango-markup cues included (parsed by gst-subparse's pure-Rust
# pango-markup reimplementation). Nothing here links pango or cairo.
#
# gst-subparse is here for its `subparse_formats` + `pango_markup` re-exports
# alone; the plugin's elements are registered by receiver-core, not by us.
gst-subparse.workspace = true
parley.workspace = true
peniko.workspace = true
vello_cpu.workspace = true
anyhow.workspace = true
smallvec.workspace = true
thiserror.workspace = true
clap.workspace = true
slint = { workspace = true, optional = true, features = [ "compat-1-2", "std" ] }

[dev-dependencies]
# tests/cue_ir_engine.rs drives the REAL parser element into the engine, so it
# needs an appsrc/appsink pair to bracket it.
gst-app.workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
gst-allocators = { package = "gstreamer-allocators", version = "0.25" }

[target.'cfg(target_os = "linux")'.dependencies]
egl-sys = { path = "../egl-sys", optional = true }
glutin_egl_sys = { version = "0.7.1", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
i-slint-backend-winit = { workspace = true, optional = true }
libplacebo-vulkan = { path = "../libplacebo-vulkan", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
gst-gl-egl = { package = "gstreamer-gl-egl", version = "0.25" }
glutin_egl_sys = { version = "0.7.1", optional = true }

[features]
default = []
# The GPU renderer: libplacebo (which builds the C library from the git
# submodule), OpenGL and EGL, plus the sink traits built on them
# (`placebo`/`opengl`/`video_sink`/`egl`/`dmabuf`).
#
# OFF by default. Nothing under test here renders: the cue, cue-IR and
# subpicture engines — what `tests/` and `fuzz/` drive — are pure CPU
# rasterization, so a test build has no business compiling libplacebo. The
# products that DO render (receiver-ui, and receiver-core's re-export surface
# via its own `render`) ask for it by name.
render = [
    "dep:libplacebo",
    "dep:glow",
    "dep:egl-sys",
    "dep:glutin_egl_sys",
]
# Mirrors receiver-core's feature of the same name: pulls in the Wayland
# subsurface sink and its winit / vulkan dependencies.
wayland-subsurface = [
    "render",
    "dep:wayland-client",
    "dep:wayland-backend",
    "dep:wayland-protocols",
    "dep:raw-window-handle",
    "dep:i-slint-backend-winit",
    "dep:libplacebo-vulkan",
    "slint/backend-winit",
    "slint/renderer-dodvg",
]

[build-dependencies]
gst-static-link.workspace = true
