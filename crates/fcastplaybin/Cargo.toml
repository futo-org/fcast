[package]
name = "fcastplaybin"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
gst = { workspace = true, features = ["v1_22"] }
# The subtitle transport (phase 5; subtitleoverlay was deleted at step 8 and
# there is no other arm): the text branch ends in an `appsink` whose samples
# carry buffer + caps + SEGMENT together, which is what makes a cue's running
# time computable per sample with no sticky tracking in the driver.
gst-app = { workspace = true }
# The subtitle parser the receiver ships, for its `cueir::CueIrMeta` alone: a
# `text-format=cue-ir` buffer carries plain UTF-8 text with the structured cue
# attached as that meta, and reading it back is a downcast, not a parse (the
# plugin builds as an rlib precisely so an in-process consumer can name the
# type). The RENDERER is still in another crate this one does not depend on.
gst-subparse = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The TSan gate's negative canary (tests/tsan_canary.rs) has to be
# parking_lot's mutex specifically: the crate synchronizes with parking_lot,
# and whether the sanitizer sees its happens-before edges is the empirical
# question that canary answers.
parking_lot = { workspace = true }
fcasttest = { path = "../fcasttest" }
# fcastaudiostretch: the constructor builds it unconditionally, and in
# production it is the RECEIVER that registers it (receiver-core::gstreamer).
# Test processes have to do the receiver's part themselves.
fcast-gst-elements = { path = "../fcast-gst-elements" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The `hands` executor's protocol is model-checked under loom (the `loom_`
# tests in src/hands.rs, which build.rs gates behind FCAST_LOOM=1). A
# DEV-dependency, and the cfg comes from the build script rather than from
# RUSTFLAGS, for two reasons that are both about blast radius:
#
#  * `RUSTFLAGS="--cfg loom"` applies to the WHOLE dependency graph, and this
#    crate's dev-dependencies include hyper-util and tokio, which carry their
#    own `cfg(loom)` branches and do not compile under it. Measured, not
#    feared: that is what the first attempt did.
#  * A cargo FEATURE would be turned on by `cargo test --all-features`, which
#    xtask's test step runs across the workspace - and a build with loom's
#    primitives in `Hands` panics outside a loom model, so every suite would
#    fail. An env-gated build-script cfg cannot be enabled by accident.
loom = "0.7"
