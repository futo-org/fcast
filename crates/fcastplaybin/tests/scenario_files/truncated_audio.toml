# The only file in the suite that injects a FAULT. Every other document describes
# media that runs to its declared end, so the whole `spec::Fault` path is
# unexercised by the sweep even though the fuzz driver leans on it.
#
# `kind = "eos"` at buffer 5 makes ftestsrc push EOS after five audio packets and
# stop, with the segment and the declared duration still saying 800 ms. That is
# what a truncated file looks like. A container whose index promises more than the
# payload holds, a stream cut off by a dropped connection and a recording that
# stopped mid-write all produce it. The receiver meets one whenever a download
# dies partway.
#
# Distinct from ragged_durations.toml and audio_eos_during_preroll.toml, which
# also end audio early. There the DURATION is short, so every element downstream
# agrees the branch is 600 ms or 40 ms long and the EOS lands exactly where the
# segment ends. Here the branch claims 800 ms and delivers 100 ms, so the EOS
# arrives with the segment far from exhausted:
#
# * anything that computes "how much is left" from the segment rather than from
#   the EOS keeps waiting for 700 ms of audio that will never arrive,
# * anything that treats an EOS short of the segment end as an ERROR fails a load
#   that must simply play what it has,
# * the pipeline EOS must still come from the LAST stream (video, at 800 ms), not
#   from the branch that gave up first.
#
# Buffer 5 rather than 0, so the audio sink prerolls, reaches PLAYING and renders
# real data before the branch dies. An EOS at buffer 0 would be the empty-stream
# case that empty_text_stream.toml already owns, and the sweep's own
# `buffer_count() > 0` assertion would be what failed rather than anything about
# truncation.
key = "truncatedaudio"
duration_ms = 800
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

# 100 ms of the 800 ms the stream advertises.
[[stream.fault]]
buffer_index = 5
kind = "eos"
