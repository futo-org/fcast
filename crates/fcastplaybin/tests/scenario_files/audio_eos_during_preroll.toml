# The audio branch is over almost before it started: 40 ms of audio (two packets)
# against 1200 ms of video and text. Audio EOS therefore travels the graph while
# the pipeline is still prerolling, not during steady playback.
#
# ragged_durations.toml already has audio ending before video, but at 600 ms of
# 1600 ms - comfortably inside PLAYING, after everything has settled. Here the ratio
# is 1:30 and the absolute time is smaller than the preroll itself, so the ordering
# is genuinely different: the audio sink receives EOS at roughly the moment it
# finishes prerolling, and the state change to PLAYING is applied to a branch that
# has already ended.
#
# That ordering is what breaks. A branch that reports "no more data" before the
# pipeline has agreed it is running is how a preroll wait ends up waiting for a sink
# that will never see another buffer, and the audio sink is the branch that normally
# drives the clock, so it is the worst one to lose first. The pipeline EOS must
# still wait for video at 1200 ms rather than following the audio branch.
#
# Real media does this: a stinger or channel ident with a one-frame audio tag, a
# file whose audio track was cut short by a bad mux, a stream that starts with an
# empty audio segment.
#
# NOTE: no top-level duration_ms - it overwrites every stream at registration and
# would flatten the whole point, see ragged_durations.toml.
key = "audioeospreroll"
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25
duration_ms = 1200

# Exactly two 20 ms packets, then EOS.
[[stream]]
id = "audio_0"
kind = "audio"
duration_ms = 40

[[stream]]
id = "text_0"
kind = "text"
duration_ms = 1200

# Deliberately after the audio branch has already ended: the text branch must keep
# delivering into a pipeline whose audio side is finished.
[[stream.cue]]
start_ms = 600
end_ms = 900
text = "AFTERAUDIO"
