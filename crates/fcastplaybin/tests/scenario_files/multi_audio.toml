# Two audio streams in one collection, which nothing else in the harness has. The
# file itself only proves the shape plays (one audio stream is selected, the other
# stays in the collection undecoded), but it is the media a later audio-track-switch
# test in tests/scenarios.rs needs.
#
# The second stream deliberately differs in RATE: a switch to it has to renegotiate
# the audio chain rather than reuse the first stream's caps, which is where a
# switch-TO flush either works or leaves the sink stuck on stale caps.
#
# TRAP, do not "improve" this by varying more fields: rate is the ONLY audio
# property ftestadec can actually deliver. `caps::raw_audio_caps()` pins
# `channels = RAW_AUDIO_CHANNELS` (2) in the decoder's SRC pad template, and
# `raw_audio_caps_at()` re-pins it whatever the stream declared. GstAudioDecoder
# proxies that src template onto its sink-pad ACCEPT_CAPS query, so a stream
# declaring `channels = 1` is a caps promise the decoder answers "no" to, and the
# file fails INTERMITTENTLY with the famously unhelpful "Your GStreamer
# installation is missing a plug-in." This file declared `channels = 1` below
# until exactly that was diagnosed. The same trap exists on video:
# `raw_video_caps()` pins width=16,height=16, so only `fps` may vary there.
key = "multiaudio"
duration_ms = 1200
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"
rate = 48000
channels = 2

[[stream]]
id = "audio_1"
kind = "audio"
rate = 44100
channels = 2
