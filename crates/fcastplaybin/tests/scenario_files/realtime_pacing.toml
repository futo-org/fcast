# The whole media pushed at REALTIME instead of as fast as possible. Every other
# file in the suite uses `as_fast_as_possible`, where ftestsrc dumps the entire clip
# into the queues in milliseconds and the sinks then meter it out against the clock.
#
# That default hides an entire class of behaviour, because a pipeline whose queues
# are always full never has to deal with a starved one. Here the source sleeps out
# each buffer's own duration before pushing it, so the queues sit near EMPTY for the
# whole run and every downstream element sees data arrive at exactly the rate it
# consumes it. Network and live sources behave this way, and so does any local file
# once the read is slower than the decode.
#
# What that changes concretely: preroll completes only when the first buffer of each
# branch has actually been produced (not instantly from a pre-filled queue), the
# multiqueue never applies backpressure so its buffering logic is exercised at the
# other extreme, and EOS arrives when the source finishes rather than when the sinks
# drain. A load that races the source (asking for a duration, a position or a
# collection before any data exists) has a real window to lose in here.
#
# 400 ms keeps that honest without paying for it: at realtime pacing the file costs
# its own duration in wall clock, and the shape does not get any truer by lasting
# longer.
key = "realtimepacing"
duration_ms = 400
bytes_per_buffer = 64
pacing = "realtime"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

[[stream]]
id = "text_0"
kind = "text"

[[stream.cue]]
start_ms = 100
end_ms = 300
text = "RT00"
