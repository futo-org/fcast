# Two degenerate cue bounds in one text stream.
#
# ZERO is a cue with start_ms == end_ms, so ftestsrc pushes a buffer with
# duration 0 (the parser only refuses end < start, a zero-length cue is legal
# data). Real subtitle tracks carry these whenever an authoring tool rounds two
# timestamps onto the same frame. A renderer that divides by the duration, or
# that keys "still on screen" on `pts + duration > now`, treats this cue as
# never displayable and can also treat it as never expiring.
#
# PASTEND runs 700..1400 while the media is 800 ms long, so the last text buffer
# outlives the clip by 600 ms. build_schedule leaves the trailing GAP out (the
# cursor is already past the duration) and the text branch goes EOS with a cue
# still notionally on screen, while video and audio keep pushing to 800 ms. The
# interesting part is the ordering: the text branch's EOS must not drag the
# pipeline EOS forward, and the un-expired cue must not keep the overlay from
# forwarding the last video frames.
key = "cuepastend"
duration_ms = 800
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

[[stream]]
id = "text_0"
kind = "text"

# Zero-length: a buffer with duration 0 at the very first timestamp.
[[stream.cue]]
start_ms = 0
end_ms = 0
text = "ZERO"

[[stream.cue]]
start_ms = 100
end_ms = 300
text = "MID"

# Ends 600 ms after the media does.
[[stream.cue]]
start_ms = 700
end_ms = 1400
text = "PASTEND"
