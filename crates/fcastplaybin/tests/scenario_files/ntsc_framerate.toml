# The only file in the suite whose streams share no common timescale, and the only
# one with a FRACTIONAL framerate.
#
# 30000/1001 is 29.97 fps. That is the framerate of NTSC-descended media
# everywhere, in broadcast, on DVD, out of most cameras and across a large share
# of what the receiver is handed in practice. Every other file here runs at a
# whole number of frames per second, where a frame is an exact number of
# milliseconds and every video timestamp lands on a round value.
#
# That hides something. `spec::frame_pts` computes a PTS from the frame INDEX
# rather than by accumulating a duration, so a frame length that is not a whole
# number of nanoseconds cannot drift. At 25 fps that rule is untestable, because a
# frame is exactly 40000000 ns and accumulating would give the same answer. Here
# frame 1 is at 33366666 ns and frame 2 at 66733333, so consecutive durations
# differ by a nanosecond and an accumulating implementation walks away from the
# real timeline over the clip.
#
# The audio is 44100 Hz against a 20 ms packet, so the two branches share no
# common multiple at all. No video frame boundary ever coincides with an audio
# packet boundary anywhere in the clip. Anything that pairs the branches by
# equal timestamps, or that decides a branch has "caught up" by comparing
# positions for equality, has nothing to match on here.
#
# Also the only exercise of the document parser's `fps = [numer, denom]` form
# through a real playback. toml_round_trip.rs proves it survives serialisation.
# Nothing proved it survives a pipeline.
key = "ntscframerate"
duration_ms = 1000
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = [30000, 1001]
# 15 frames of the 29 the clip holds, so the GOP boundary is not a factor of the
# frame count either.
keyframe_interval = 15

[[stream]]
id = "audio_0"
kind = "audio"
rate = 44100
channels = 2
