# A complete three-kind clip that is over in 120 ms: three video frames, six audio
# packets, one cue. Every other file here runs for at least 800 ms.
#
# What that buys is a clip shorter than the windows the pipeline itself works in.
# The suite's own settle window is 200 ms (QUIESCENT_SETTLE) and the receiver's
# selection pump is polled at the same order of magnitude, so this media reaches
# EOS before a single settle cycle completes: PLAYING and EndOfStream are in flight
# together instead of separated by a comfortable second of playback. Anything that
# schedules work "shortly after preroll" (a deferred selection, a delayed text
# policy poll, a late latency recalculation) fires against an already-finished
# pipeline here, which is where use-after-EOS and lost-event bugs live.
#
# keyframe_interval = 0 is the intra-only shape (build_schedule's `== 0` branch
# marks EVERY frame a sync point, the way MJPEG or ProRes media does) rather than
# a disabled knob; with three frames a GOP of 25 would put the only keyframe first
# and make the distinction invisible.
key = "tinyclip"
duration_ms = 120
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 0

[[stream]]
id = "audio_0"
kind = "audio"

[[stream]]
id = "text_0"
kind = "text"

# Gapped on both sides, so even at this length the branch carries a GAP, the cue
# and a trailing GAP.
[[stream.cue]]
start_ms = 20
end_ms = 100
text = "TINY00"
