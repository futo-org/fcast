# A selected subtitle track that never says anything. text_0 has a full-length
# duration and NO cues, so `build_schedule` emits exactly one GAP covering the
# whole clip and then EOS. Not one buffer, for the entire run.
#
# This is dead air taken to its limit, and it is ordinary media. A subtitle track
# is selected for the whole film. A two-minute stretch with no dialogue is a
# single gap that long, and the receiver meets it on every load that starts before
# the first line is spoken.
#
# The suite pins the other points on that axis and not this one:
#
# * late_first_cue.toml is 80% gap with a cue at the end, so something eventually
#   arrives and anything waiting on the branch is eventually released.
# * empty_text_stream.toml has an EMPTY schedule (duration 0), so the branch is
#   over before selection runs and never gaps at all.
#
# Here the branch is live and advertised for the whole clip, is selected, is
# linked into the overlay, and delivers nothing but one GAP. A branch that is
# considered ready only once a buffer has been through it never becomes ready. A
# text position derived from the last buffer never advances. A still-prerolling
# check that waits for text data waits for the whole clip.
#
# The GAP is a single event spanning 1200 ms, not a stream of them, because
# `build_schedule` coalesces. The cursor starts at 0 and no cue moves it, so the
# trailing fill is one gap from 0 to the duration. Anything that treats a GAP as a
# small keepalive tick sees one that is longer than every timeout in the pipeline.
key = "silenttext"
duration_ms = 1200
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

# No [[stream.cue]] at all. That is the whole file.
[[stream]]
id = "text_0"
kind = "text"
