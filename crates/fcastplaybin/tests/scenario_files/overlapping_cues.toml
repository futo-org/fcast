# Cues whose display windows overlap: OVA covers 100..500 while OVB starts at 300
# and OVC lives entirely inside OVB. Every other text file in the suite is a tidy
# sequence of disjoint cues, which no real subtitle track is: ASS dialogue, karaoke
# and two-speaker SRT all put several cues on screen at once.
#
# The starts stay sorted (a subtitle demuxer delivers in start order), so the
# BUFFER order is still monotonic. What is not monotonic is build_schedule's
# cursor: it tracks the last cue's END, so OVC (350..450) moves the cursor
# BACKWARDS from 700 to 450, and the next gap is emitted over 450..700, a span the
# already-delivered OVB buffer still covers. A branch that derives its position
# from the last GAP it saw therefore goes backwards here, and a running-time
# clamp that assumes gaps only ever move forward is what breaks.
#
# The payloads are distinct per cue so a renderer that drops the overlapped one
# rather than compositing both is visible in the log rather than silently equal.
key = "overlappingcues"
duration_ms = 1000
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

[[stream]]
id = "text_0"
kind = "text"

# Spans the next two cues entirely.
[[stream.cue]]
start_ms = 100
end_ms = 500
text = "OVA"

# Starts while OVA is still on screen.
[[stream.cue]]
start_ms = 300
end_ms = 700
text = "OVB"

# Nested inside OVB, and ends before it: this is the cue that rewinds the cursor.
[[stream.cue]]
start_ms = 350
end_ms = 450
text = "OVC"

# Back to a disjoint cue, reached through a gap that overlaps OVB's window.
[[stream.cue]]
start_ms = 700
end_ms = 900
text = "OVD"
