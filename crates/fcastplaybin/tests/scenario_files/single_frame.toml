# The shortest media the harness can express: exactly ONE buffer per sink.
#
# ftestsrc schedules whole buffers only (buffer_count floors duration by the step),
# so 40 ms at 25 fps is one video frame and 20 ms of audio is one 20 ms packet.
# Anything shorter schedules zero buffers and the media would carry no data at all.
#
# One buffer per sink is the case where the PREROLL buffer and the only rendered
# buffer are the same buffer: GstBaseSink records it once from the preroll vfunc
# and again from render, and everything that normally happens "after preroll, while
# more data flows" here happens with the schedule already exhausted. A load that
# waits for a second buffer before declaring itself ready, or a stream-collection
# settle that needs data to still be arriving, hangs on this file and on no other.
#
# NOTE: no top-level duration_ms on purpose. The top-level key overwrites every
# stream's duration at registration, and the two kinds need different ones to land
# on exactly one buffer each (a video frame is 40 ms at 25 fps, an audio packet is
# always 20 ms).
key = "singleframe"
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25
duration_ms = 40

[[stream]]
id = "audio_0"
kind = "audio"
duration_ms = 20
