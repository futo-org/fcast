# Two embedded text streams. Only one can be selected at a time, so this is the
# media an embedded-subtitle-switch test needs, and it is also the media that puts
# a second text stream in the id space an external subtitle is later added to.
#
# The cue text is prefixed per stream (TXA / TXB) rather than numbered alike: a
# switch test asserts WHICH stream reached the overlay, and identical payloads
# would make that assertion vacuous.
key = "multitext"
duration_ms = 1200
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

[[stream]]
id = "text_0"
kind = "text"

[[stream.cue]]
start_ms = 250
end_ms = 450
text = "TXA00"

[[stream.cue]]
start_ms = 550
end_ms = 750
text = "TXA01"

[[stream.cue]]
start_ms = 850
end_ms = 1050
text = "TXA02"

[[stream]]
id = "text_1"
kind = "text"

[[stream.cue]]
start_ms = 250
end_ms = 450
text = "TXB00"

[[stream.cue]]
start_ms = 550
end_ms = 750
text = "TXB01"

[[stream.cue]]
start_ms = 850
end_ms = 1050
text = "TXB02"
