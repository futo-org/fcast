# The `smoke_full_pipeline` scenario of tests/scenarios.rs as a file: video, audio
# and text over the whole field topology, no injected fault. The exemplar for what
# a scenario file looks like, see crates/fcasttest/src/scenario/toml.rs for the
# full set of keys.
key = "tomlsmoke"
duration_ms = 1200
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

# Dense enough that a cue is on screen for most of the clip.
[[stream]]
id = "text_0"
kind = "text"

[[stream.cue]]
start_ms = 250
end_ms = 375
text = "CUE00"

[[stream.cue]]
start_ms = 500
end_ms = 625
text = "CUE01"

[[stream.cue]]
start_ms = 750
end_ms = 875
text = "CUE02"

[[stream.cue]]
start_ms = 1000
end_ms = 1125
text = "CUE03"
