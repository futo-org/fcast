# A text stream that carries nothing but a GAP for most of the clip: the first cue
# starts at 1600 ms of 2000 ms. ftestsrc emits one GAP event covering the lead-in
# (see build_schedule), so the branch is live and advertised from the start while
# producing no buffer at all for 80% of the run.
#
# The bug class: a text branch with no early data used to gate things it should not.
# Preroll must not wait for a cue, the collection must advertise the stream anyway,
# and the late cue must still arrive rather than being flushed away as stale.
key = "latecue"
duration_ms = 2000
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[[stream]]
id = "audio_0"
kind = "audio"

[[stream]]
id = "text_0"
kind = "text"

[[stream.cue]]
start_ms = 1600
end_ms = 1900
text = "LATE00"
