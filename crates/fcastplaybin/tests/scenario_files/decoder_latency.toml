# Decoders that do not answer immediately: the video decoder reports 15-18 ms of
# latency and holds three frames back before it outputs anything, the audio decoder
# reports 5 ms. No other file in the suite sets [stream.decoder] at all, so every
# other run is against decoders that turn one input buffer into one output buffer
# with no delay - which no real decoder does.
#
# reorder_frames = 3 is the B-frame shape: output starts only once a fourth frame
# has arrived, and the three held frames are released from the drain/finish path,
# i.e. at EOS. That makes the tail of the clip arrive in a burst after the last
# input buffer, which is precisely when a pipeline that has already decided the
# stream is over drops them. The suite asserts exactly one EOS at the video sink,
# so a decoder that finishes its held frames AFTER forwarding EOS shows up here.
#
# The reported latencies are the other half. The pipeline's latency is the maximum
# over its branches plus the sinks', so 15 ms on video against 5 ms on audio makes
# the two branches disagree and forces a real aggregation rather than the trivial
# all-zero one. jitter_ms = 3 makes the video decode time vary per frame (drawn from
# the key-seeded PRNG, so it is the same awkward sequence every run) instead of
# being a constant offset a latency calculation can absorb exactly.
#
# The knobs stay small on purpose: a decoder slower than realtime would turn every
# buffer late at the sink and the file would be measuring lateness, not latency.
key = "decoderlatency"
duration_ms = 800
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 25
keyframe_interval = 25

[stream.decoder]
latency_ms = 15
jitter_ms = 3
reorder_frames = 3

[[stream]]
id = "audio_0"
kind = "audio"

[stream.decoder]
latency_ms = 5

[[stream]]
id = "text_0"
kind = "text"

# Text leaves ftestsrc already parsed, so no decoder is plugged on this branch: the
# cue timing is unaffected by the video decoder's delay, which is what makes a
# subtitle that drifts against a late video frame visible at all.
[[stream.cue]]
start_ms = 200
end_ms = 500
text = "LAT00"
