# The opposite end from fps_one.toml: 120 fps, so 60 video buffers in 500 ms, and a
# GOP longer than the whole clip.
#
# keyframe_interval = 600 with only 60 frames means frame 0 is the ONLY sync point
# in the media; every other frame carries DELTA_UNIT. Long-GOP media is the norm
# (a 10 s GOP is a common streaming encoder default), and it is what makes a flush
# expensive: after any flushing seek the decoder has to be handed frame 0 again or
# it has nothing to decode from.
#
# needs_keyframe_after_flush = true turns that from a comment into an assertion.
# ftestdec then DROPS every frame after a FLUSH_STOP until a sync point arrives, so
# if fcastplaybin's load-time seek restarts the schedule anywhere but on frame 0,
# no video reaches the sink at all and the suite's "the media has video but none
# reached the sink" check fires. ftestsrc's start_index walks a video stream back to
# the nearest keyframe exactly like a demuxer landing on one, and this file is what
# proves the two halves agree.
#
# 120 fps is also the tightest buffer spacing here (8.33 ms), which is the other
# half of the point: the per-buffer path runs 60 times in the time smoke.toml
# spends on 30 frames, and the video queue fills from a genuinely dense stream
# rather than from big buffers.
key = "densefps"
duration_ms = 500
bytes_per_buffer = 64
pacing = "as_fast_as_possible"

[[stream]]
id = "video_0"
kind = "video"
fps = 120
keyframe_interval = 600

[stream.decoder]
needs_keyframe_after_flush = true

[[stream]]
id = "audio_0"
kind = "audio"
