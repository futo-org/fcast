plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.fcast.rsreceiver.android'
    compileSdk 34

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
                jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
            }
        }
    }

    defaultConfig {
        applicationId "org.fcast.rsreceiver.android"
        // Tied to the level the native library links against, which is
        // GSTREAMER_SRC_ANDROID_API in android-linker-aarch64, default 28.
        // This said 25, which the library can never satisfy: it needs
        // libnativewindow and libaaudio, both API 26, plus the AAudio, AImage
        // and AHardwareBuffer calls behind them. An API 25 device would
        // install the apk and then fail to load the .so. Move the two
        // together or not at all.
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug-signed so adb install keeps working locally; a real
            // release keystore replaces this for distribution
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // annotation only; material dragged in emoji2 whose startup init cost
    // 15% of launch CPU, and nothing here uses material widgets
    compileOnly libs.annotation
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}