[package]
name = "receiver-android"
version = "3.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
rcore = { package = "receiver-ui", path = "../../../crates/receiver-ui", default-features = false, features = ["android"] }
android_logger = "0.15.1"
log-panics = { version = "2.1.0", features = ["with-backtrace"]}
log = { workspace = true, features = ["release_max_level_debug"] }
jni = "0.21.1"
ndk-context = "0.1.1"
tokio.workspace = true
parking_lot.workspace = true
# _exit at quit, see end_process
libc = "0.2"
# GL beside the Vulkan the renderer brings, for boxes without a Vulkan driver
wgpu = { version = "30", default-features = false, features = ["gles"] }

[lib]
name = "fcastreceiver"
crate-type = ["cdylib"]