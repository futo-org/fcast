[package]
name = "desktop-receiver"
version = "3.0.4"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
gst-static-env.workspace = true
# A direct dependency so this crate's build script sees the links metadata
# (rpath dirs).
gstreamer-src.workspace = true
rcore = { package = "receiver-ui", path = "../../crates/receiver-ui", features = ["desktop"] }
anyhow.workspace = true

[features]
default = ["systray"]
systray = ["rcore/systray"]
kms-backend = ["rcore/kms-backend"]
tracy = ["rcore/tracy"]
static-gst-plugins = ["rcore/static-gst-plugins"]
airplay = ["rcore/airplay"]
# Compiles the i-slint-video-wgpu presentation lane in; it stays dormant
# unless FCAST_DESKTOP_WGPU_VIDEO=1 is set at runtime.
video-wgpu = ["rcore/video-wgpu"]

[target.'cfg(target_os = "windows")'.dependencies]
enable-ansi-support = "0.3.1"

[build-dependencies]
gst-static-link.workspace = true
winresource = "0.1.28"