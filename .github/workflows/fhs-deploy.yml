name: FHS Deploy

on:
  push:
    branches: [fhs]
    paths:
      - 'receivers/experimental/fhs/**'
      - 'crates/receiver-core/**'
      - 'crates/fcast-protocol/**'
      - 'crates/libplacebo/**'
      - 'crates/libplacebo-sys/**'
      - 'crates/google-cast-protocol/**'
      - 'crates/inhibit-screensaver/**'
      - 'crates/egl-sys/**'
      - 'crates/fiatlux/**'
      - 'crates/fiatlux-sys/**'
      - 'tools/remote-pipeline-dbg/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fhs-deploy.yml'
  workflow_dispatch:
    inputs:
      fhs_core_ref:
        description: 'fhs-core branch/tag/sha to build from'
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: fhs-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.15.2"
  RUST_NIGHTLY: "nightly-2026-01-15"
  GHCR_IMAGE: ghcr.io/futo-org/fhs-core/sysext/fcast
  FHS_CORE_REF: ${{ github.event.inputs.fhs_core_ref || 'master' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v3"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            rustflags: "-C link-arg=-lgcc"
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/fedora/fedora-bootc:44
      options: --user root
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install pre-checkout deps
        run: dnf -y install git zstd

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Extract receiver version
        id: version
        run: |
          VERSION=$(grep -m1 '^version *=' receivers/experimental/fhs/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out fhs-core (for sysext build scripts)
        uses: actions/checkout@v4
        with:
          repository: futo-org/fhs-core
          ref: ${{ env.FHS_CORE_REF }}
          path: fhs-core
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Install fcast build deps
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            glib2-devel gobject-introspection-devel \
            fontconfig-devel libseat-devel libxkbcommon-devel libinput-devel \
            libheif-devel pango-devel cairo-devel cairo-gobject-devel libdrm-devel openssl-devel \
            mesa-libgbm-devel libunistring-devel \
            libshaderc-devel vulkan-headers vulkan-loader-devel \
            libvorbis-devel libtheora-devel libogg-devel libva-devel \
            libgudev-devel srt-devel libass-devel wavpack-devel \
            libsoup3-devel pulseaudio-libs-devel \
            meson ninja-build cmake flex bison nasm \
            pipewire-devel \
            gcc gcc-c++ make patch rustup \
            clang-devel ccache flatbuffers-compiler

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Rust
        run: |
          rustup-init -y --default-toolchain ${{ env.RUST_NIGHTLY }} \
            --profile minimal --target ${{ matrix.rust-target }} --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up ccache (C build cache — GStreamer subprojects)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.arch }}-fhs-gst
          max-size: 500M

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          key: ${{ matrix.arch }}-fhs
          cache-targets: true
          cache-on-failure: true

      - name: Install cargo-generate-rpm
        uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1  # v2.81.2
        with:
          tool: cargo-generate-rpm@0.21.0

      - name: Check out fhs-fiatlux-client
        uses: actions/checkout@v4
        with:
          repository: futo-org/fhs-fiatlux-client
          ref: master
          path: fiatlux-client
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          persist-credentials: false

      - name: Build fhs-fiatlux-client (link dep)
        run: |
          (cd fiatlux-client && make build-${{ matrix.arch }})
          echo "FL_LIB_PATH=${{ github.workspace }}/fiatlux-client/zig-out/${{ matrix.arch }}/lib" >> "$GITHUB_ENV"
          echo "FL_INCLUDE_PATH=${{ github.workspace }}/fiatlux-client/zig-out/${{ matrix.arch }}/include" >> "$GITHUB_ENV"

      - name: Build fhs-receiver
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo clean -p fiatlux-sys -p fiatlux -p fhs-receiver || true
          cargo xtask receiver build-static \
            --receiver-package fhs-receiver \
            --receiver-flavor fhs \
            --target ${{ matrix.rust-target }}

      - name: Package fcast-receiver RPM
        run: |
          cargo generate-rpm -p receivers/experimental/fhs --target ${{ matrix.rust-target }}
          mkdir -p tmp
          RPM_FILE="fcast-receiver-${{ steps.version.outputs.version }}-1.${{ matrix.arch }}.rpm"
          cp "target/${{ matrix.rust-target }}/generate-rpm/${RPM_FILE}" tmp/fcast-receiver.rpm
          ls -la tmp/fcast-receiver.rpm

      - name: Compute package delta
        env:
          FCAST_RPM: ${{ github.workspace }}/tmp/fcast-receiver.rpm
        run: bash fhs-core/os/extensions/fcast/compute-package-delta.sh

      - name: Install sysext build deps
        # Done after compute-package-delta so these tools don't appear in
        # the pre-fcast snapshot and inflate the delta.
        run: dnf -y install erofs-utils binutils glib2 fontconfig gtk3 yq

      - name: Build sysext layers (4 .raws)
        env:
          PKG_DIR: ${{ github.workspace }}/pkg
        run: |
          set -euo pipefail
          mkdir -p "$PKG_DIR"
          bash fhs-core/os/extensions/fcast/build.sh

      - name: Compute artifact name
        id: artifact
        run: echo "name=${GHCR_IMAGE##*/}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Upload .raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: pkg/tmp/fcast-*-sysext.raw
          retention-days: 1

  # Workaround since cannot use private workflows in public repo
  resolve:
    name: Resolve release counter
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.r.outputs.version }}
      release: ${{ steps.r.outputs.release }}
      build_type: ${{ steps.r.outputs.build_type }}
      image: ${{ steps.r.outputs.image }}
    steps:
      - name: Check out fhs-core (resolve script)
        uses: actions/checkout@v4
        with:
          repository: futo-org/fhs-core
          ref: ${{ env.FHS_CORE_REF }}
          path: fhs-core
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GH_PAT }}" | oras login ghcr.io -u USERNAME --password-stdin

      - name: Resolve
        id: r
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          INPUT_VERSION: ${{ needs.build.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: fhs
          SHA: ${{ github.sha }}
        run: bash fhs-core/os/extensions/resolve-sysext.sh >> "$GITHUB_OUTPUT"

  # Workaround since cannot use private workflows in public repo
  publish:
    name: Publish (${{ matrix.arch }})
    needs: [build, resolve]
    runs-on: ubuntu-latest
    concurrency:
      group: sysext-ghcr.io/futo-org/fhs-core/sysext/fcast:${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.release }}.${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Check out fhs-core (publish script)
        uses: actions/checkout@v4
        with:
          repository: futo-org/fhs-core
          ref: ${{ env.FHS_CORE_REF }}
          path: fhs-core
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Download pre-built .raw artifacts
        uses: actions/download-artifact@v4
        with:
          name: fcast-${{ matrix.arch }}
          path: ${{ github.workspace }}/pkg/tmp

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GH_PAT }}" | oras login ghcr.io -u USERNAME --password-stdin

      - name: Publish + sign
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          ARCH: ${{ matrix.arch }}
          PKG_DIR: ${{ github.workspace }}/pkg
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE: ${{ needs.resolve.outputs.release }}
          BUILD_TYPE: ${{ needs.resolve.outputs.build_type }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash fhs-core/os/extensions/publish-sysext.sh
